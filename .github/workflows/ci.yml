name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      SANITY_CONTENT_MODE: fallback
      COMMERCE_MODE: demo
      COMMERCE_SECURITY_SECRET: ci-only-commerce-secret-000000000000
      SANITY_STUDIO_PROJECT_ID: abc123xy
      SANITY_STUDIO_DATASET: production

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Lint with zero warnings
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate CMS schema
        run: npm run cms:schema:validate

      - name: Generate CMS types and reject drift
        run: |
          npm run cms:typegen
          git diff --exit-code -- src/shared/types/sanity.generated.ts

      - name: Generate CMS and commerce migration manifest
        run: npm run cms:manifest

      - name: Run CMS and commerce contract tests
        run: npm test

      - name: Build production bundle
        run: npm run build
