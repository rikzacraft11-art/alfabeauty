<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 360" fill="none" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <!-- Stardust Gradient based strictly on #EABD68 & #5D221C -->
    <linearGradient id="dustGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EABD68" stop-opacity="0" />
      <stop offset="20%" stop-color="#5D221C" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FFF2D1" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#EABD68" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#EABD68" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="sparklePt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FFF2D1" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#EABD68" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EABD68" stop-opacity="0" />
    </radialGradient>

    <filter id="waveBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flowing Golden Nebula Ribbon in #EABD68 -->
  <path d="M-50,200 C300,60 650,280 1050,140 C1450,20 1700,220 1970,160 L1970,180 C1700,240 1450,40 1050,160 C650,300 300,80 -50,220 Z" 
        fill="url(#dustGradient)" 
        opacity="0.75" 
        filter="url(#waveBlur)" />

  <!-- Multiple Fine Harmonic Light Threads -->
  <path d="M-20,208 C320,70 670,288 1070,148 C1460,30 1710,228 1950,170" fill="none" stroke="#FFFDF5" stroke-width="1.8" opacity="0.85" />
  <path d="M-20,215 C330,80 680,295 1080,155 C1470,40 1720,235 1950,178" fill="none" stroke="#EABD68" stroke-width="1.2" opacity="0.65" />
  <path d="M-20,195 C310,60 660,275 1060,135 C1450,20 1700,218 1950,162" fill="none" stroke="#5D221C" stroke-width="0.8" opacity="0.45" />

  <!-- Stardust Dispersion Particles in #EABD68 & White -->
  <g fill="url(#sparklePt)">
    <!-- Swarm A: Left Arc -->
    <circle cx="180" cy="150" r="1.5" /><circle cx="210" cy="130" r="2.0" /><circle cx="230" cy="115" r="3.2" />
    <circle cx="260" cy="95"  r="2.8" /><circle cx="290" cy="80"  r="3.5" /><circle cx="320" cy="70"  r="4.2" />
    <circle cx="350" cy="75"  r="3.0" /><circle cx="380" cy="90"  r="2.2" /><circle cx="410" cy="115" r="1.8" />
    <circle cx="440" cy="140" r="2.5" /><circle cx="470" cy="170" r="3.0" /><circle cx="500" cy="200" r="2.0" />

    <!-- Swarm B: Center Wave -->
    <circle cx="620" cy="265" r="2.5" /><circle cx="660" cy="285" r="3.5" /><circle cx="700" cy="295" r="4.0" />
    <circle cx="740" cy="290" r="3.2" /><circle cx="780" cy="275" r="2.8" /><circle cx="820" cy="250" r="2.2" />
    <circle cx="860" cy="220" r="1.8" /><circle cx="900" cy="190" r="2.5" /><circle cx="940" cy="165" r="3.0" />
    <circle cx="980" cy="145" r="3.8" /><circle cx="1020" cy="135" r="4.5" /><circle cx="1060" cy="130" r="3.5" />

    <!-- Swarm C: Right Sweep -->
    <circle cx="1200" cy="100" r="2.8" /><circle cx="1240" cy="80" r="3.5" /><circle cx="1280" cy="65" r="4.0" />
    <circle cx="1320" cy="50"  r="3.2" /><circle cx="1360" cy="40" r="4.5" /><circle cx="1400" cy="38" r="3.0" />
    <circle cx="1440" cy="45"  r="2.5" /><circle cx="1480" cy="60" r="3.8" /><circle cx="1520" cy="85" r="2.2" />
    <circle cx="1580" cy="130" r="3.0" /><circle cx="1640" cy="180" r="3.5" /><circle cx="1700" cy="215" r="4.2" />
    <circle cx="1750" cy="220" r="3.0" /><circle cx="1800" cy="205" r="2.5" /><circle cx="1850" cy="185" r="2.0" />
  </g>
</svg>
