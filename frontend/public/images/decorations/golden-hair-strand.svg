<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2200" fill="none" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- ─── 2.5D Depth of Field (DoF) Blurs & Blooms ─── -->
    <!-- Background Out-of-Focus Soft Bokeh Blur (Deep 2.5D Layer) -->
    <filter id="dofBackgroundBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="heavyBlur" />
    </filter>

    <!-- Mid-Ground Soft Focus Blur -->
    <filter id="dofMidBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="midBlur" />
      <feMerge>
        <feMergeNode in="midBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Foreground In-Focus Crisp Specular Hair Gloss -->
    <filter id="foregroundGloss" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="subtleGloss" />
      <feMerge>
        <feMergeNode in="subtleGloss" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 2.5D Bokeh Particle Bloom -->
    <filter id="bokehBloom" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" result="orbGlow" />
      <feMerge>
        <feMergeNode in="orbGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ─── Official Brand Hair Shimmer Gradients (#EABD68 & #5D221C) ─── -->
    <linearGradient id="hairSpineReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EABD68" stop-opacity="0" />
      <stop offset="10%" stop-color="#EABD68" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#FFFDF5" stop-opacity="0.95" />
      <stop offset="48%" stop-color="#EABD68" stop-opacity="0.7" />
      <stop offset="62%" stop-color="#FFF8E0" stop-opacity="0.98" />
      <stop offset="80%" stop-color="#EABD68" stop-opacity="0.65" />
      <stop offset="94%" stop-color="#5D221C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EABD68" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="hairAmberReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5D221C" stop-opacity="0" />
      <stop offset="18%" stop-color="#EABD68" stop-opacity="0.45" />
      <stop offset="38%" stop-color="#FFF2D1" stop-opacity="0.85" />
      <stop offset="58%" stop-color="#5D221C" stop-opacity="0.3" />
      <stop offset="78%" stop-color="#EABD68" stop-opacity="0.6" />
      <stop offset="95%" stop-color="#EABD68" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#5D221C" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="hairSoftRibbonReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EABD68" stop-opacity="0" />
      <stop offset="12%" stop-color="#EABD68" stop-opacity="0.25" />
      <stop offset="32%" stop-color="#FFF5D9" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#EABD68" stop-opacity="0.35" />
      <stop offset="82%" stop-color="#FFF2D1" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#EABD68" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="bokehOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#FFF8E0" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#EABD68" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EABD68" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════════
       REVERSE 2.5D DIAGONAL FLOWING HAIR STRAND:
       Origin: Top-Right Section 1 (x: 1980, y: 240)
       Trajectory: Cascades behind docked salon mirror (x: 1050, y: 920)
       Boundary: Crosses Sec 1 -> Sec 2 Handover (x: 820, y: 1320)
       Descent: Flows across left side of Section 2 (x: 480, y: 1720)
       Exit: Bottom-Left Section 2 (x: -50, y: 2140)
       ═══════════════════════════════════════════════════════════════════════ -->

  <!-- ─── 2.5D Layer 1: Out-of-Focus Background Hair Silhouette (Deep Blur) ─── -->
  <path d="M 2000,240 C 1620,360 1340,720 1050,920 C 740,1140 480,1480 280,1800 C 140,2020 30,2100 -60,2140"
        fill="none"
        stroke="#EABD68"
        stroke-width="140"
        stroke-linecap="round"
        opacity="0.16"
        filter="url(#dofBackgroundBlur)" />

  <!-- ─── 2.5D Layer 2: Soft Volumetric Silk Hair Body (Mid-Field Focus) ─── -->
  <path d="M 2000,240 C 1620,360 1340,720 1050,920 C 740,1140 480,1480 280,1800 C 140,2020 30,2100 -60,2140"
        fill="none"
        stroke="url(#hairSoftRibbonReverse)"
        stroke-width="40"
        stroke-linecap="round"
        opacity="0.7"
        filter="url(#dofMidBlur)" />

  <!-- ─── 2.5D Layer 3: Secondary Intertwined Hair Fiber (Counter Wave) ─── -->
  <path d="M 2020,210 C 1640,300 1300,780 1000,950 C 700,1120 520,1540 240,1820 C 100,1980 0,2080 -70,2120"
        fill="none"
        stroke="url(#hairAmberReverse)"
        stroke-width="18"
        stroke-linecap="round"
        opacity="0.8" />

  <!-- ─── 2.5D Layer 4: Tertiary Twisted Keratin Filament ─── -->
  <path d="M 1970,270 C 1660,420 1380,660 1090,900 C 780,1160 440,1440 320,1780 C 180,2060 40,2120 -40,2160"
        fill="none"
        stroke="url(#hairAmberReverse)"
        stroke-width="8.5"
        stroke-linecap="round"
        opacity="0.75" />

  <!-- ─── 2.5D Layer 5: Foreground Razor-Sharp Glossy Spine Core (In-Focus Shine) ─── -->
  <path d="M 2000,240 C 1620,360 1340,720 1050,920 C 740,1140 480,1480 280,1800 C 140,2020 30,2100 -60,2140"
        fill="none"
        stroke="url(#hairSpineReverse)"
        stroke-width="3.2"
        stroke-linecap="round"
        filter="url(#foregroundGloss)" />

  <!-- ─── 2.5D Layer 6: Ultra-Fine Specular Micro-Filaments (Realistic Texture) ─── -->
  <!-- Micro Strand A (Upper Light Highlight) -->
  <path d="M 2000,232 C 1625,352 1345,712 1055,912 C 745,1132 485,1472 285,1792 C 145,2012 35,2092 -55,2132"
        fill="none"
        stroke="#FFFDF5"
        stroke-width="1.3"
        stroke-linecap="round"
        opacity="0.9" />

  <!-- Micro Strand B (Lower Warm Filament) -->
  <path d="M 2000,248 C 1615,368 1335,728 1045,928 C 735,1148 475,1488 275,1808 C 135,2028 25,2108 -65,2148"
        fill="none"
        stroke="#EABD68"
        stroke-width="1.1"
        stroke-linecap="round"
        opacity="0.7" />

  <!-- Micro Strand C (Floating Tapered Flyaway Whisp) -->
  <path d="M 1980,190 C 1580,260 1260,680 960,960 C 660,1240 510,1400 210,1740 C 60,1920 -30,2030 -90,2080"
        fill="none"
        stroke="url(#hairSpineReverse)"
        stroke-width="1.6"
        stroke-dasharray="20 5 40 8"
        stroke-linecap="round"
        opacity="0.75" />

  <!-- ─── 2.5D Layer 7: Out-of-Focus Bokeh Orbs & Drifting Stardust Particles ─── -->
  <g fill="url(#bokehOrb)">
    <!-- Top-Right Origin (Section 1) -->
    <circle cx="1840" cy="280" r="3.2" filter="url(#bokehBloom)" /><circle cx="1770" cy="320" r="5.0" filter="url(#bokehBloom)" /><circle cx="1700" cy="380" r="2.5" />
    <circle cx="1630" cy="440" r="4.2" filter="url(#bokehBloom)" /><circle cx="1560" cy="510" r="2.8" /><circle cx="1490" cy="590" r="3.6" />
    <circle cx="1420" cy="670" r="5.5" filter="url(#bokehBloom)" /><circle cx="1350" cy="740" r="2.6" /><circle cx="1280" cy="800" r="4.0" />

    <!-- Center Transition (Around Docked Mirror & Handover Zone) -->
    <circle cx="1200" cy="860" r="4.8" filter="url(#bokehBloom)" /><circle cx="1130" cy="900" r="6.0" filter="url(#bokehBloom)" />
    <circle cx="1050" cy="930" r="3.5" /><circle cx="970" cy="970" r="5.2" filter="url(#bokehBloom)" />
    <circle cx="890"  cy="1020" r="3.6" /><circle cx="810" cy="1090" r="5.5" filter="url(#bokehBloom)" />
    <circle cx="730"  cy="1190" r="4.0" /><circle cx="650" cy="1310" r="4.8" filter="url(#bokehBloom)" />

    <!-- Left Section 2 Cascade towards Bottom-Left Exit -->
    <circle cx="570" cy="1440" r="5.0" filter="url(#bokehBloom)" /><circle cx="500" cy="1550" r="3.2" />
    <circle cx="430" cy="1650" r="5.5" filter="url(#bokehBloom)" /><circle cx="360" cy="1730" r="3.8" />
    <circle cx="290" cy="1810" r="5.8" filter="url(#bokehBloom)" /><circle cx="220" cy="1900" r="4.2" />
    <circle cx="140" cy="1980" r="5.0" filter="url(#bokehBloom)" /><circle cx="60"  cy="2050" r="3.5" /><circle cx="-20" cy="2100" r="2.8" />
  </g>
</svg>
