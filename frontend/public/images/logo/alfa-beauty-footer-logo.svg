<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" fill="none">
  <defs>
    <!-- Gradient for Left Butterfly Wing -->
    <linearGradient id="wingLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C6B"/>
      <stop offset="50%" stop-color="#E51A2C"/>
      <stop offset="100%" stop-color="#8F0511"/>
    </linearGradient>

    <!-- Gradient for Right Butterfly Wing -->
    <linearGradient id="wingRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A88"/>
      <stop offset="60%" stop-color="#D91424"/>
      <stop offset="100%" stop-color="#6E000B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Butterfly Icon Mark (Pure Vector Geometry) -->
  <g transform="translate(10, 12) scale(0.92)" filter="url(#markGlow)">
    <!-- Left Upper Wing -->
    <path 
      d="M 58 135 C 42 125 22 96 24 64 C 26 32 48 14 66 12 C 78 11 88 18 90 32 C 93 48 84 78 72 104 C 66 118 60 128 58 135 Z" 
      fill="url(#wingLeftGrad)"
    />
    <!-- Left Wing Inner Swirl -->
    <path 
      d="M 64 68 C 68 56 74 44 76 34 C 77 28 73 24 68 24 C 54 26 38 42 36 68 C 35 90 48 112 58 122 C 55 106 58 84 64 68 Z" 
      fill="#BA181B" 
      opacity="0.85"
    />

    <!-- Right Upper / Lower Wing Loop (The Signature 'B' Curve) -->
    <path 
      d="M 62 135 C 72 142 88 144 104 136 C 122 126 134 104 130 82 C 126 62 108 50 88 56 C 104 42 120 28 116 16 C 112 5 96 8 84 20 C 72 32 66 52 64 74 C 62 96 60 118 62 135 Z" 
      fill="url(#wingRightGrad)"
    />
    
    <!-- Central Spine Highlight -->
    <path 
      d="M 60 25 C 66 55 64 95 60 135" 
      stroke="#FFAAB2" 
      stroke-width="3" 
      stroke-linecap="round"
      opacity="0.9"
    />
  </g>

  <!-- 2. Typography Lockup (Crisp Pure White & Gold Tracked Text) -->
  <g transform="translate(160, 0)">
    <!-- Main Brand Name -->
    <text 
      x="0" 
      y="76" 
      fill="#FFFFFF" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="44" 
      font-weight="300" 
      letter-spacing="0.04em"
    >
      Alfa Beauty
    </text>

    <!-- Descriptor / Subtitle -->
    <text 
      x="2" 
      y="110" 
      fill="#D4AF37" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="12" 
      font-weight="600" 
      letter-spacing="0.26em"
    >
      COSMETICA INDONESIA
    </text>

    <!-- Tagline -->
    <text 
      x="2" 
      y="134" 
      fill="#888888" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="11" 
      font-weight="400" 
      letter-spacing="0.1em"
    >
      Everyone can be the beauty expert
    </text>
  </g>
</svg>
